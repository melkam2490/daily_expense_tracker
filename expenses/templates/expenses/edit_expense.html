
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'expenses/style.css' %}">
    <title>Edit Expense</title>
</head>
<body>
    <h1>Edit Expense</h1>

    <form method="post">
        {% csrf_token %}

        <label for="title">Expense Name:</label>
        <input
            type="text"
            id="title"
            name="title"
            value="{{ expense.title }}"
            required
        >

        <label for="amount">Amount ($):</label>
        <input
            type="number"
            id="amount"
            name="amount"
            value="{{ expense.amount }}"
            min="0.01"
            step="0.01"
            required
        >

        <label for="category">Category:</label>
        <select id="category" name="category" required>
            <option value="Food" {% if expense.category == "Food" %}selected{% endif %}>Food</option>
            <option value="Transport" {% if expense.category == "Transport" %}selected{% endif %}>Transport</option>
            <option value="Bills" {% if expense.category == "Bills" %}selected{% endif %}>Bills</option>
            <option value="Shopping" {% if expense.category == "Shopping" %}selected{% endif %}>Shopping</option>
            <option value="Other" {% if expense.category == "Other" %}selected{% endif %}>Other</option>
        </select>

        <label for="date">Date:</label>
        <input
            type="date"
            id="date"
            name="date"
            value="{{ expense.date|date:'Y-m-d' }}"
            required
        >

        <button type="submit">Save Changes</button>
    </form>

    <p><a href="{% url 'home' %}">Cancel and go back</a></p>
</body>
</html>
